<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SiteForge — Interview</title>
  <meta name="description" content="Tell us about your business and SiteForge will forge your website." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0a09" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand"><span class="mark">SF</span> SiteForge</div>
      <span class="step-counter" id="counter" aria-hidden="true"></span>
    </div>
  </header>

  <main class="wrap" style="max-width: 720px; padding-top: 2.75rem; padding-bottom: 3.5rem;">
    <div class="rail" aria-hidden="true" style="margin-bottom: 2.25rem;"><span id="rail"></span></div>

    <!-- loading -->
    <div id="loading" class="card center rise">
      <span class="spinner"></span>
      <p class="muted" style="margin-top: 0.85rem;">Heating the forge…</p>
    </div>

    <!-- question -->
    <section id="stage" class="hidden" aria-live="polite"></section>

    <!-- completion -->
    <section id="done" class="hidden"></section>

    <p id="fatal" class="notice hidden" role="alert"></p>
  </main>

  <footer class="foot"><div class="wrap">SiteForge · interview · answers save as you go</div></footer>

  <script src="/interview.js"></script>
</body>
</html>
